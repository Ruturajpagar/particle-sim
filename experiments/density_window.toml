# Does lowering the density open an "atomic gas" window?
#
# Follows atom_window (results/atom_window/FINDINGS.md), which found chains
# dominating at every T <= 0.3 at density 200 / 30^2 = 0.22.
#
# Hypothesis (stated before running): chains grow only when bound pairs meet
# each other, and meetings get rarer as density drops, while a pair's own
# binding does not depend on density. So at low density there should be a
# temperature range where isolated p+e pairs are the majority outcome:
# above the temperature where chains break up, below the one where pairs
# themselves dissociate. At the atom_window density we expect no such window
# (a repeat check of that result over a wider T range).
#
# Changes from atom_window: T extended to 1.0, dt reduced from 0.0025 to
# 0.0015 (hot runs approach the stiff 1/r^8 core more closely), and steps
# scaled so the simulated time per stage is about the same as before.
# Core strength fixed at the default c = 0.125.
#
# Density = 200 / box^2: box 30 -> 0.22, 50 -> 0.08, 80 -> 0.031.

name = "density_window"
description = "Temperature x density sweep: does low density open an atomic-gas window?"
seeds = 3
base_seed = 200

[system]
dim = 2
box = 30.0
dt = 0.0015
log_every = 250
r_bond = 2.0
boundary = "reflecting"

[[species]]
name = "p"
mass = 10.0
charge = 1.0
count = 100

[[species]]
name = "e"
mass = 1.0
charge = -1.0
count = 100

[[rules]]
type = "Coulomb"
k = 1.0

[[rules]]
type = "CoreRepulsion"
c = 0.125
n = 8

[[protocol]]
name = "anneal"
steps = 23000
gamma = 0.5
t_start = 2.0
t_end = 0.1

[[protocol]]
name = "hold"
steps = 10000
gamma = 0.5
t_start = 0.1
t_end = 0.1

[[protocol]]
name = "isolated"
steps = 6500
gamma = 0.0

[[sweep]]
name = "T_final"
paths = ["protocol.0.t_end", "protocol.1.t_start", "protocol.1.t_end"]
values = [0.1, 0.2, 0.35, 0.5, 0.75, 1.0]

[[sweep]]
name = "box"
paths = ["system.box"]
values = [30.0, 50.0, 80.0]
