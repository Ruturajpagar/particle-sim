[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent"
version = "0.1.0"
description = "Bottom-up particle interaction simulator: fundamental pair rules, emergent bound structures, anomaly detection."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["emergent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
