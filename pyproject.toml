[project]
name = "emergent"
version = "0.1.0"
description = "Bottom-up particle interaction simulator: fundamental pair rules, emergent bound structures, anomaly detection."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
